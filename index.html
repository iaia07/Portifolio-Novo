<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f4f1">
  <meta name="description" content="Acesso ao portfólio acadêmico de Iara Kethelyn.">
  <title>Acesso | Iara Kethelyn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>

  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="card-heading">
        <p class="card-kicker">IARA K. • PORTFÓLIO 2026</p>
        <h1 id="login-title">Entre na sua conta</h1>
        <p class="card-subtitle">Digite seu usuário e senha para continuar.</p>
      </div>

      <!-- O envio é tratado por js/script.js com Supabase -->
      <form class="login-form" id="loginForm">
        <div class="field">
          <label for="usuario">Usuário / e-mail</label>
          <input
            type="email"
            id="usuario"
            name="usuario"
            placeholder="Digite seu e-mail"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-extras">
          <label class="remember">
            <input type="checkbox" name="lembrar" value="sim">
            <span>Lembrar de mim</span>
          </label>
          <a href="./areas/contatos.html">Não consegue entrar?</a>
        </div>

        <button class="login-button" id="loginBtn" type="submit" aria-busy="false">
          <span id="loginBtnText">Entrar</span> <span aria-hidden="true">&#8599;</span>
        </button>

        <p id="mensagem" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <p class="card-footnote">
        Ainda não tem acesso? <a href="./areas/contatos.html">Entre em contato</a>
      </p>
    </section>
  </main>

  <noscript>
    <p class="noscript-note">Ative o JavaScript para fazer login.</p>
  </noscript>

  <!-- Fallback: avisa se o módulo não carregar (ex.: abrindo o arquivo com file://) -->
  <script>
    window.__loginPronto = false;
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.getElementById('loginForm');
      var msg = document.getElementById('mensagem');
      if (!form) return;

      form.addEventListener('submit', function (event) {
        if (window.__loginPronto) return;
        event.preventDefault();
        if (!msg) return;
        msg.textContent = 'O login não carregou. Abra pelo localhost ou pelo GitHub Pages, não clicando duas vezes no arquivo.';
        msg.className = 'form-message is-error';
      });
    });
  </script>

  <script type="module" src="./js/script.js"></script>
</body>
</html>
